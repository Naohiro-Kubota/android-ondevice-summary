name: pr-check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, lint, and JVM tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - name: Requirement references
        run: python3 scripts/validate_requirements.py
      - name: Source dependency policy
        run: |
          if git grep -n -E '^[[:space:]]*import[[:space:]]+(com\.google\.firebase|com\.google\.mlkit|okhttp3)' -- ':(glob)app/src/main/**/domain/**/*.kt' ':(glob)app/src/main/**/application/**/*.kt'; then
            echo "Domain/Application must not import concrete SDKs"
            exit 1
          else
            test "$?" -eq 1
          fi
          if git grep -n -E '^[[:space:]]*import[[:space:]]+com\.google\.firebase' -- ':(glob)app/src/main/**/presentation/**/*.kt'; then
            echo "Presentation must not import Firebase"
            exit 1
          else
            test "$?" -eq 1
          fi

  emulator:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          script: if [ "${{ github.event_name }}" = "schedule" ]; then ./gradlew connectedDebugAndroidTest; else ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.SmallTest; fi
